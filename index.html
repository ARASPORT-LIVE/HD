<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARA SPORT LIVE - Web Player</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    
    <style>
        /* هێنانی فۆنتی GoranFontRegular-Regular */
        @font-face {
            font-family: 'GoranFontRegular-Regular';
            src: url('GoranFontRegular-Regular.ttf') format('truetype'),
                 url('GoranFontRegular-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        /* جێبەجێکردنی فۆنت بۆ سەرجەم بەشەکان و تێکستەکان */
        * {
            box-sizing: border-box;
            font-family: 'GoranFontRegular-Regular', Tahoma, Arial, sans-serif !important;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .player-header {
            background: #0f172a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2563eb;
        }

        .brand-title {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* ستایلی یاریپێکەری ڤیدیۆ */
        .video-js {
            width: 100%;
            height: 500px;
        }

        .vjs-big-play-button {
            background-color: rgba(37, 99, 235, 0.8) !important;
            border: none !important;
            border-radius: 50% !important;
            width: 70px !important;
            height: 70px !important;
            line-height: 70px !important;
            margin-top: -35px !important;
            margin-left: -35px !important;
        }

        .ticker-bar {
            background: #0284c7;
            color: #ffffff;
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .ticker-text {
            display: inline-block;
            padding-right: 100%;
            animation: ticker 25s linear infinite;
            font-size: 15px;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(100%, 0, 0); }
        }

        @media (max-width: 600px) {
            .video-js {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- بەشی سەرەوە (Header) -->
        <div class="player-header">
            <div class="brand-title">ARA SPORT LIVE</div>
            <div class="live-badge">ڕاستەوخۆ</div>
        </div>

        <!-- بەشی ڤیدیۆ پلەیەر -->
        <video 
            id="ara-sport-player" 
            class="video-js vjs-default-skin vjs-big-play-centered" 
            controls 
            preload="auto" 
            poster="https://via.placeholder.com/900x500/0f172a/ffffff?text=ARA+SPORT+LIVE">
            
            <!-- لینک یان پەخشی HLS/m3u8 لێرە دابنێ -->
            <source src="HTTPS://YOUR_STREAM_URL_HERE/stream.m3u8" type="application/x-mpegURL">
            پێگەی تۆ پشتگیری ئەم ڤیدیۆیە ناکات.
        </video>

        <!-- بەشی تێکستی جوڵاو (Ticker) -->
        <div class="ticker-bar">
            <div class="ticker-text">
                بەخێربێن بۆ کەناڵی ARA SPORT LIVE - بۆ بینینی تەواوی یارییەکان و بەرنامەکان لەگەڵمان بەردەوام بن.
            </div>
        </div>
    </div>

    <!-- Video.js JS -->
    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        var player = videojs('ara-sport-player');
    </script>
</body>
</html>
