<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARA SPORT LIVE - Web Player</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <!-- Font Awesome بۆ ئایکۆنەکانی پلەیەر -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        @font-face {
            font-family: 'GoranFontRegular-Regular';
            src: url('GoranFontRegular-Regular.ttf') format('truetype'),
                 url('GoranFontRegular-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            font-family: 'GoranFontRegular-Regular', Tahoma, Arial, sans-serif !important;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .player-header {
            background: #0f172a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2563eb;
        }

        .brand-title {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .content-area {
            display: flex;
            flex-direction: row;
            width: 100%;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .video-js {
            width: 100%;
            height: 480px;
        }

        /* چاککردنی فۆنتی ئایکۆنەکانی Video.js */
        .video-js .vjs-icon-placeholder:before {
            font-family: VideoJS !important;
        }

        /* ستایلی لۆگۆی ناو ڤیدیۆ */
        .vjs-watermark-logo {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.65);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(4px);
        }

        .vjs-watermark-text {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .vjs-watermark-text span {
            color: #38bdf8;
        }

        .playlist-sidebar {
            width: 300px;
            background: #0f172a;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            max-height: 480px;
            overflow-y: auto;
        }

        .playlist-title {
            padding: 12px 15px;
            background: #1e293b;
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
        }

        .playlist-item {
            padding: 12px 15px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .playlist-item:hover {
            background: #1e293b;
        }

        .playlist-item.active {
            background: #2563eb;
            color: #fff;
        }

        .ticker-bar {
            background: #0284c7;
            color: #ffffff;
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-text {
            display: inline-block;
            padding-right: 100%;
            animation: ticker 25s linear infinite;
            font-size: 15px;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(100%, 0, 0); }
        }

        /* --- شاشەی ئەکتیڤکردن (Activation Modal) --- */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(8px);
        }

        .auth-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .auth-card h2 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .auth-card p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            text-align: center;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }

        .auth-input:focus {
            border-color: #2563eb;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background: #1d4ed8;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 768px) {
            .content-area {
                flex-direction: column;
            }
            .playlist-sidebar {
                width: 100%;
                max-height: 220px;
            }
            .video-js {
                height: 260px;
            }
            .vjs-watermark-logo {
                top: 10px;
                right: 10px;
                padding: 4px 8px;
            }
            .vjs-watermark-text {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- شاشەی داواکردنی کۆدی ئەکتیڤکردن -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h2>ئەکتیڤکردنی ARA SPORT LIVE</h2>
            <p>تکایە کۆدی چوونەژوورەوە بنووسە بۆ چالاککردنی پەخشەکە:</p>
            <input type="password" id="accessCodeInput" class="auth-input" placeholder="کۆد لێرە بنووسە..." />
            <button onclick="verifyCode()" class="auth-btn">چالاککردن</button>
            <div id="errorMsg" class="error-msg">کۆدەکە هەڵەیە! تکایە دووبارە هەوڵبدەرەوە.</div>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="player-header">
            <div class="brand-title">ARA SPORT LIVE</div>
            <div class="live-badge">ڕاستەوخۆ</div>
        </div>

        <div class="content-area">
            <div class="video-container">
                <video 
                    id="ara-sport-player" 
                    class="video-js vjs-default-skin vjs-big-play-centered" 
                    controls 
                    preload="auto">
                </video>
            </div>

            <div class="playlist-sidebar">
                <div class="playlist-title">لیستی کەناڵەکان</div>
                <div id="playlist-items">
                    <div class="playlist-item">تکایە چاوەڕێ بکە...</div>
                </div>
            </div>
        </div>

        <div class="ticker-bar">
            <div class="ticker-text">
                بەخێربێن بۆ کەناڵی ARA SPORT LIVE - بۆ بینینی تەواوی یارییەکان و بەرنامەکان لەگەڵمان بەردەوام بن.
            </div>
        </div>
    </div>

    <!-- Video.js JS -->
    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        // سیستەمی فێریکردنی کۆد (Ara2026)
        const SECRET_CODE = "Ara2026";

        function checkAuth() {
            const isAuth = localStorage.getItem("ara_sport_auth");
            if (isAuth === "true") {
                document.getElementById("authOverlay").style.display = "none";
                initPlayer();
            }
        }

        function verifyCode() {
            const input = document.getElementById("accessCodeInput").value;
            const errorMsg = document.getElementById("errorMsg");
            if (input === SECRET_CODE) {
                localStorage.setItem("ara_sport_auth", "true");
                document.getElementById("authOverlay").style.display = "none";
                initPlayer();
            } else {
                errorMsg.style.display = "block";
            }
        }

        var player;

        function initPlayer() {
            if (!player) {
                player = videojs('ara-sport-player');

                player.ready(function() {
                    var watermark = document.createElement('div');
                    watermark.className = 'vjs-watermark-logo';
                    watermark.innerHTML = `<div class="vjs-watermark-text">ARA SPORT <span>HD</span></div>`;
                    this.el().appendChild(watermark);
                });

                loadM3UPlaylist();
            }
        }

        // خوێندنەوەی فایلی M3U
        async function loadM3UPlaylist() {
            try {
                const response = await fetch('playlist.m3u');
                const text = await response.text();
                
                const lines = text.split('\n');
                const channels = [];
                let currentName = '';

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const parts = line.split(',');
                        currentName = parts[parts.length - 1].trim();
                    } else if (line && !line.startsWith('#')) {
                        if (currentName) {
                            channels.push({ name: currentName, url: line });
                            currentName = '';
                        }
                    }
                });

                renderPlaylist(channels);
            } catch (error) {
                document.getElementById('playlist-items').innerHTML = '<div class="playlist-item">کێشەیەک لە بارکردنی لیستەکە هەیە</div>';
            }
        }

        function renderPlaylist(channels) {
            const container = document.getElementById('playlist-items');
            container.innerHTML = '';

            channels.forEach((channel, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `📺 ${channel.name}`;
                div.onclick = function() {
                    playChannel(channel.url, this);
                };
                container.appendChild(div);
            });

            if (channels.length > 0) {
                playChannel(channels[0].url, null);
            }
        }

        function playChannel(url, element) {
            if (element) {
                const items = document.querySelectorAll('.playlist-item');
                items.forEach(item => item.classList.remove('active'));
                element.classList.add('active');
            }

            if (player) {
                player.src({
                    src: url,
                    type: 'application/x-mpegURL'
                });
                player.play();
            }
        }

        // پشکنین کاتێک پەڕەکە دەکەرێتەوە
        checkAuth();
    </script>
</body>
</html>
