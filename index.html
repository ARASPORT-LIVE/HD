<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARA TV - Web Player</title>
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        @font-face {
            font-family: 'GoranFontRegular-Regular';
            src: url('GoranFontRegular-Regular.ttf') format('truetype'),
                 url('GoranFontRegular-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'GoranFontRegular-Regular', Tahoma, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .player-header {
            background: #0f172a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2563eb;
            gap: 8px;
        }

        .brand-title { font-size: 20px; font-weight: bold; color: #38bdf8; white-space: nowrap; }
        .header-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }

        .expire-countdown-badge {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            direction: ltr;
        }

        .live-badge { background-color: #ef4444; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; }

        .content-area { display: flex; flex-direction: row; width: 100%; }
        .video-container { flex: 1; position: relative; background: #000; }
        .video-js { width: 100%; height: 480px; font-family: Arial, sans-serif !important; }

        .stream-status-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); display: flex;
            justify-content: center; align-items: center; z-index: 1001;
            font-size: 22px; font-weight: bold; color: #f59e0b;
        }

        .playlist-sidebar { width: 320px; background: #0f172a; border-right: 1px solid #334155; display: flex; flex-direction: column; max-height: 480px; }
        .category-tabs { display: flex; background: #1e293b; overflow-x: auto; border-bottom: 1px solid #334155; }
        .category-tab { padding: 10px 14px; font-size: 13px; font-weight: bold; color: #94a3b8; cursor: pointer; white-space: nowrap; }
        .category-tab.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; background: #0f172a; }

        .playlist-items-wrapper { flex: 1; overflow-y: auto; }
        .playlist-item { padding: 12px 15px; border-bottom: 1px solid #1e293b; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
        .playlist-item:hover { background: #1e293b; }
        .playlist-item.active { background: #2563eb; color: #fff; }

        .ticker-bar { background: #0284c7; color: #ffffff; padding: 4px 0; overflow: hidden; white-space: nowrap; }
        .ticker-text { display: inline-block; padding-right: 100%; animation: ticker 25s linear infinite; font-size: 13px; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(100%, 0, 0); } }

        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.96); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .auth-card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; text-align: center; max-width: 460px; width: 90%; }
        .auth-card h2 { color: #38bdf8; margin-bottom: 12px; font-size: 20px; }
        
        .mac-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; color: #ef4444; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; direction: ltr; }
        .copy-btn { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        .send-actions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .send-row { display: flex; gap: 10px; }
        .send-btn { flex: 1; padding: 9px; border: none; border-radius: 6px; color: white; font-size: 12px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
        .whatsapp-btn { background: #16a34a; }
        .sms-btn { background: #0284c7; }

        .auth-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #059669; color: #fff; font-size: 15px; cursor: pointer; font-weight: bold; }
        .status-msg { font-size: 13px; margin-top: 12px; color: #ef4444; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .content-area { flex-direction: column; }
            .playlist-sidebar { width: 100%; max-height: 250px; }
            .video-js { height: 260px; }
        }
    </style>
</head>
<body>

    <div id="authOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card">
            <h2>ئەکتیڤکردنی ئامێرەکەت</h2>
            <p style="margin-bottom: 10px; font-size: 13px; color: #94a3b8;">تکایە ئەم ماک ئادرێسە بۆ ئەدمین بنێرە:</p>
            
            <div class="mac-box">
                <span id="deviceMac">باردەکرێت...</span>
                <button class="copy-btn" onclick="copyMac()">کۆپی</button>
            </div>

            <div class="send-actions">
                <div class="send-row">
                    <a id="waLink1" href="#" target="_blank" class="send-btn whatsapp-btn"><i class="fab fa-whatsapp"></i> واتسئاپ 1</a>
                    <a id="waLink2" href="#" target="_blank" class="send-btn whatsapp-btn" style="background: #15803d;"><i class="fab fa-whatsapp"></i> واتسئاپ 2</a>
                </div>
                <div class="send-row">
                    <a id="smsLink" href="#" class="send-btn sms-btn"><i class="fas fa-comment-alt"></i> SMS</a>
                </div>
            </div>

            <button onclick="checkActivation(true)" class="auth-btn">پشکنینی ئەکتیڤبوون</button>
            <div id="statusMsg" class="status-msg">ئەم ئامێرە ئەکتیڤ نەکراوە!</div>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="player-header">
            <div class="brand-title">ARA TV</div>
            <div class="header-right">
                <div id="countdownBox" class="expire-countdown-badge" style="display: none;">
                    ⏳ <span id="countdownTimer">00d 00h 00m</span>
                </div>
                <div class="live-badge">ڕاستەوخۆ</div>
            </div>
        </div>

        <div class="content-area">
            <div class="video-container">
                <video id="ara-sport-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
                <div id="streamStatusOverlay" class="stream-status-overlay" style="display: none;">
                    <i class="fas fa-spinner fa-spin" style="margin-left: 10px;"></i> باردەکرێت...
                </div>
            </div>

            <div class="playlist-sidebar">
                <div id="categoryTabs" class="category-tabs"></div>
                <div class="playlist-items-wrapper">
                    <div id="playlist-items">
                        <div class="playlist-item">تکایە چاوەڕێ بکە...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ticker-bar">
            <div class="ticker-text">
                بەخێر بێن بۆ سیستمی پەخشی ARA TV
            </div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        const GOOGLE_SHEET_MAC_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgvWrahp_pwJWRnX4QCE4KmuhUb6gl5Rk_rDpjA2ODuCNH1nyLUcD-L0g0I6PrD45F0hb7odKi_zbW/pub?gid=0&single=true&output=csv"; 
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRgvWrahp_pwJWRnX4QCE4KmuhUb6gl5Rk_rDpjA2ODuCNH1nyLUcD-L0g0I6PrD45F0hb7odKi_zbW/pub?gid=250464113&single=true&output=csv";

        function getDeviceMac() {
            let mac = localStorage.getItem("ara_device_mac");
            if (!mac) {
                const hexDigits = "0123456789ABCDEF";
                let macArr = [];
                for (let i = 0; i < 6; i++) {
                    macArr.push(hexDigits.charAt(Math.floor(Math.random() * 16)) + hexDigits.charAt(Math.floor(Math.random() * 16)));
                }
                mac = macArr.join(":");
                localStorage.setItem("ara_device_mac", mac);
            }
            return mac.toUpperCase().trim();
        }

        const currentMac = getDeviceMac();
        document.getElementById("deviceMac").innerText = currentMac;

        const phone1 = "9647501224994";
        const phone2 = "9647748134314";
        const msgText = encodeURIComponent(`سڵاو، تکایە ئەم ئامێرە ئەکتیڤ بکە:\nMAC Address:\n${currentMac}`);
        
        document.getElementById("waLink1").href = `https://wa.me/${phone1}?text=${msgText}`;
        document.getElementById("waLink2").href = `https://wa.me/${phone2}?text=${msgText}`;
        document.getElementById("smsLink").href = `sms:${phone1}?body=${msgText}`;

        function copyMac() {
            navigator.clipboard.writeText(currentMac);
            alert("ماک ئادرێسەکە کۆپی کرا!");
        }

        function parseCSVLine(text) {
            let result = [], cell = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') inQuotes = !inQuotes;
                else if (c === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
                else cell += c;
            }
            result.push(cell.trim());
            return result;
        }

        // بۆ خوێندنەوەی بەروار بە هەردوو فۆرماتی (DD/MM/YYYY) و (YYYY-MM-DD)
        function parseFlexibleDate(dateStr) {
            if (!dateStr) return null;
            dateStr = dateStr.trim().replace(/"/g, '');

            let parts = dateStr.split(' ');
            let datePart = parts[0];
            let timePart = parts[1] || '23:59:59';

            let year, month, day;

            if (datePart.includes('/')) {
                let dSplit = datePart.split('/');
                if (dSplit[0].length === 4) {
                    year = dSplit[0]; month = dSplit[1]; day = dSplit[2];
                } else {
                    day = dSplit[0]; month = dSplit[1]; year = dSplit[2];
                }
            } else if (datePart.includes('-')) {
                let dSplit = datePart.split('-');
                if (dSplit[0].length === 4) {
                    year = dSplit[0]; month = dSplit[1]; day = dSplit[2];
                } else {
                    day = dSplit[0]; month = dSplit[1]; year = dSplit[2];
                }
            } else {
                return new Date(dateStr);
            }

            if (month && month.length === 1) month = '0' + month;
            if (day && day.length === 1) day = '0' + day;

            return new Date(`${year}-${month}-${day}T${timePart}`);
        }

        let timerInterval;
        function startCountdown(expireDateStr) {
            document.getElementById("countdownBox").style.display = "flex";
            const expireDateObj = parseFlexibleDate(expireDateStr);
            const expireTime = (expireDateObj && !isNaN(expireDateObj.getTime())) ? expireDateObj.getTime() : 0;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(function() {
                const now = new Date().getTime();
                const distance = expireTime - now;

                if (distance <= 0 || isNaN(distance)) {
                    clearInterval(timerInterval);
                    document.getElementById("countdownTimer").innerText = "ئێکسپایەر بووە";
                    if (player) player.pause();
                    document.getElementById("statusMsg").innerText = "ئابوونەکەت بەسەرچوو!";
                    document.getElementById("authOverlay").style.display = "flex";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("countdownTimer").innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
        }

        async function checkActivation(isManual = false) {
            const statusMsg = document.getElementById("statusMsg");
            if (isManual) statusMsg.innerText = "لە پشکنیندایە...";

            try {
                // بەکارهێنانی Proxy بۆ ڕێگریکردن لە کێشەی CORS
                const targetUrl = GOOGLE_SHEET_MAC_CSV_URL + "&cache=" + Date.now();
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
                
                let res = await fetch(proxyUrl);
                if (!res.ok) res = await fetch(targetUrl);

                if (res.ok) {
                    const csvText = await res.text();
                    const lines = csvText.split("\n");

                    for (let i = 1; i < lines.length; i++) {
                        const cols = parseCSVLine(lines[i]);
                        if (cols.length >= 3) {
                            const mac = cols[0].replace(/^"|"$/g, '').trim().toUpperCase();
                            const expireStr = cols[2].replace(/^"|"$/g, '').trim();

                            if (mac === currentMac) {
                                const expireDateObj = parseFlexibleDate(expireStr);
                                const expireTime = (expireDateObj && !isNaN(expireDateObj.getTime())) ? expireDateObj.getTime() : 0;
                                const now = new Date().getTime();

                                if (now > expireTime) {
                                    statusMsg.innerText = "ئابوونەکەت بەسەرچوو!";
                                    document.getElementById("authOverlay").style.display = "flex";
                                    return false;
                                }

                                document.getElementById("authOverlay").style.display = "none";
                                startCountdown(expireStr);
                                initPlayer();
                                return true;
                            }
                        }
                    }
                }
            } catch (e) { 
                console.log("Error loading activation sheet:", e); 
            }

            document.getElementById("authOverlay").style.display = "flex";
            if (isManual) statusMsg.innerText = "ئەم ئامێرە لە شیتەکەدا ئەکتیڤ نەکراوە!";
            return false;
        }

        var player;
        let parsedCategorizedChannels = {};

        function initPlayer() {
            if (!player) {
                player = videojs('ara-sport-player');
                loadGoogleSheetsPlaylist();
            }
        }

        async function loadGoogleSheetsPlaylist() {
            const playlistContainer = document.getElementById('playlist-items');
            
            const cachedData = localStorage.getItem("cached_channels");
            if (cachedData) {
                parsedCategorizedChannels = JSON.parse(cachedData);
                renderTabs();
            }

            try {
                const targetUrl = GOOGLE_SHEET_CSV_URL + "&cache=" + Date.now();
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

                let res = await fetch(proxyUrl);
                if (!res.ok) res = await fetch(targetUrl);

                if (res.ok) {
                    const csvData = await res.text();
                    const lines = csvData.split('\n');
                    let tempChannels = {};

                    lines.forEach((line, index) => {
                        if (index === 0 || !line.trim()) return;
                        const columns = parseCSVLine(line);
                        if (columns.length >= 3) {
                            let group = columns[0].replace(/^"|"$/g, '').trim() || 'گشتی';
                            const name = columns[1].replace(/^"|"$/g, '').trim();
                            const url = columns[2].replace(/^"|"$/g, '').trim();
                            if (name && url) {
                                if (!tempChannels[group]) tempChannels[group] = [];
                                tempChannels[group].push({ name, url });
                            }
                        }
                    });

                    parsedCategorizedChannels = tempChannels;
                    localStorage.setItem("cached_channels", JSON.stringify(tempChannels));
                    renderTabs();
                }
            } catch (error) {
                if (!cachedData) playlistContainer.innerHTML = '<div class="playlist-item" style="color: #ef4444;">کێشە لە خوێندنەوەی کەناڵەکان هەیە!</div>';
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';
            const categories = Object.keys(parsedCategorizedChannels);

            if (categories.length === 0) return;

            categories.forEach((cat, index) => {
                const tab = document.createElement('div');
                tab.className = `category-tab ${index === 0 ? 'active' : ''}`;
                tab.innerText = cat;
                tab.onclick = function() {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    renderPlaylist(parsedCategorizedChannels[cat]);
                };
                tabsContainer.appendChild(tab);
            });

            renderPlaylist(parsedCategorizedChannels[categories[0]]);
        }

        function renderPlaylist(channels) {
            const container = document.getElementById('playlist-items');
            container.innerHTML = '';

            channels.forEach((channel, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === 0 ? 'active' : ''}`;
                div.innerHTML = `<span>📺 ${channel.name}</span>`;
                div.onclick = function() {
                    playChannel(channel.url, this);
                };
                container.appendChild(div);
            });

            if (channels.length > 0) {
                playChannel(channels[0].url, container.children[0]);
            }
        }

        function playChannel(url, element) {
            if (element) {
                document.querySelectorAll('.playlist-item').forEach(item => item.classList.remove('active'));
                element.classList.add('active');
            }
            if (player) {
                player.src({ src: url, type: 'application/x-mpegURL' });
                player.play().catch(() => {});
            }
        }

        checkActivation();
    </script>
</body>
</html>
