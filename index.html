<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ARA TV - Web Player</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="icon-192.png">

<style>
@font-face{font-family:'GoranFontRegular-Regular';src:url('GoranFontRegular-Regular.ttf') format('truetype'),url('GoranFontRegular-Regular.woff') format('woff');font-display:swap}
:root{--ac:#38bdf8;--ac2:#8b5cf6;--g:rgba(255,255,255,.07);--gb:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;color:#fff;font-family:'GoranFontRegular-Regular',Tahoma,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:#070b16;display:flex;justify-content:center;align-items:center;padding:10px;position:relative;height:100vh;height:100dvh;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
body::before,body::after{content:"";position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;pointer-events:none}
body::before{background:#0ea5e9;top:-25vmax;right:-15vmax}
body::after{background:var(--ac2);bottom:-25vmax;left:-15vmax}
.glass{background:var(--g);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb)}
.main-wrapper{position:relative;z-index:1;width:100%;height:100%;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.player-header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;gap:8px;flex-shrink:0;border-width:0 0 1px;border-style:solid}
.brand-title{font-size:22px;font-weight:bold;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.header-right{display:flex;align-items:center;gap:8px}
.badge{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:bold;display:flex;align-items:center;gap:6px;direction:ltr}
.trial-badge{background:rgba(245,158,11,.35);border:1px solid rgba(245,158,11,.6)}
.expire-countdown-badge{background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.45);color:var(--ac)}
.live-badge{background:rgba(239,68,68,.85);padding:4px 12px;border-radius:20px;font-size:13px;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.5}}
.content-area{display:flex;flex:1;min-height:0}
.video-container{flex:1;position:relative;background:transparent;overflow:hidden}
.video-js{width:100%!important;height:100%!important;font-family:Arial,sans-serif!important}
.video-js,.video-js .vjs-tech{background-color:transparent!important}
.video-container .video-js{position:absolute!important;inset:0}
.stream-status-overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;z-index:1001;font-size:32px;color:var(--ac);background:rgba(7,11,22,.55);pointer-events:none}
.vjs-watermark-logo{position:absolute!important;top:42px;right:18px;z-index:1000;pointer-events:none;display:none;padding:4px 10px;border-radius:6px;background:rgba(15,23,42,.8);border:.07em solid rgba(56,189,248,.6);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;line-height:1}
.vjs-watermark-logo.show-watermark{display:flex!important}
.vjs-watermark-text{font:900 15px Arial;letter-spacing:0;line-height:1}
.vjs-watermark-text span{color:var(--ac)}
.vjs-live-tag{position:absolute;top:100%;left:auto;right:0;transform:none;display:none;align-items:center;gap:.3em;padding:.2em .6em;margin-top:.4em;border-radius:4px;background:rgba(239,68,68,.92);font:900 .62em Arial;letter-spacing:0;line-height:1.1;color:#fff;white-space:nowrap}
.vjs-live-tag i{width:.45em;height:.45em;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.vjs-watermark-logo.is-live .vjs-live-tag{display:flex}
.code-cover{position:absolute;z-index:999;display:none;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;white-space:nowrap;color:#fff;font:900 1em Arial;background:rgba(15,23,42,.98);border:.07em solid rgba(56,189,248,.6);border-radius:.4em}
.code-cover span{color:#38bdf8}

/* ---- Sidebar & Groups ---- */
.playlist-sidebar{width:390px;display:flex;flex-direction:column;height:100%;border-width:0 1px 0 0;border-style:solid}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex-shrink:0;font-weight:bold;font-size:16px;border-bottom:1px solid var(--gb);background:rgba(255,255,255,.04)}
.panel-head-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#panelTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.group-tabs{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;direction:rtl;flex-shrink:0;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--gb);background:rgba(255,255,255,.03)}
.group-tabs::-webkit-scrollbar{display:none}
.category-tab{padding:7px 14px;font-size:13px;font-weight:bold;color:#cbd5e1;cursor:pointer;white-space:nowrap;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);transition:.15s;flex-shrink:0;display:flex;align-items:center;gap:5px}
.category-tab:hover{color:var(--ac);background:rgba(56,189,248,.14)}
.category-tab.active{color:#fff;background:linear-gradient(135deg,rgba(56,189,248,.45),rgba(139,92,246,.45));border-color:rgba(255,255,255,.35);box-shadow:0 4px 16px rgba(56,189,248,.3)}

/* ---- Search & A-Z Filter Panel ---- */
.search-panel{display:none;flex-direction:column;gap:8px;padding:10px;border-bottom:1px solid var(--gb);background:rgba(15,23,42,.55);flex-shrink:0}
.search-panel.show{display:flex}
.search-box-wrap{position:relative;display:flex;align-items:center}
.search-input{width:100%;padding:9px 36px 9px 32px;border-radius:12px;border:1px solid rgba(56,189,248,.35);background:rgba(7,11,22,.75);color:#fff;font-family:inherit;font-size:14px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--ac);box-shadow:0 0 12px rgba(56,189,248,.25)}
.search-icon{position:absolute;right:12px;color:var(--ac);font-size:14px;pointer-events:none}
.clear-search{position:absolute;left:10px;color:#94a3b8
