<!DOCTYPE html>
<html lang="kmr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARASPORT LIVE Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; height: 100vh; flex-direction: column; }
        header { background: #1e293b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 2px solid #3b82f6; }
        .main { display: flex; flex: 1; overflow: hidden; flex-direction: row; }
        .video-container { flex: 3; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; max-height: 90vh; }
        .playlist { flex: 1; background: #1e293b; overflow-y: auto; border-left: 1px solid #334155; }
        .channel-item { padding: 15px; border-bottom: 1px solid #334155; cursor: pointer; transition: 0.2s; }
        .channel-item:hover { background: #334155; }
        .channel-item.active { background: #2563eb; color: #fff; }
        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .video-container { height: 40vh; }
            .playlist { flex: none; height: 60vh; }
        }
    </style>
</head>
<body>
    <header>ARASPORT LIVE - وەب پلەیەر</header>
    <div class="main">
        <div class="video-container">
            <video id="video" controls autoplay></video>
        </div>
        <div class="playlist" id="playlist"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const playlistEl = document.getElementById('playlist');
        const m3uUrl = './playlist.m3u'; 

        async function loadPlaylist() {
            try {
                const res = await fetch(m3uUrl);
                const text = await res.text();
                const lines = text.split('\n');
                let channels = [];
                let currentName = '';

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const commaIndex = line.lastIndexOf(',');
                        currentName = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Channel';
                    } else if (line.startsWith('http')) {
                        channels.push({ name: currentName, url: line });
                    }
                });

                playlistEl.innerHTML = '';
                channels.forEach((ch, index) => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerText = ch.name;
                    item.onclick = () => playStream(ch.url, item);
                    playlistEl.appendChild(item);
                    
                    if(index === 0) playStream(ch.url, item);
                });
            } catch (e) {
                playlistEl.innerHTML = '<div style="padding:20px;color:red;">هەڵەیەک ڕوویدا لە بارکردنی پلەی لیستەکە</div>';
            }
        }

        function playStream(url, element) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
